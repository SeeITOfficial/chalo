name = "chalo-api"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[[d1_databases]]
binding = "DB"
database_name = "chalo"
database_id = "00000000-0000-0000-0000-000000000000"

# Expires trips and deletes unflagged chats. Correctness never depends on it:
# every read already filters by expires_at.
[triggers]
crons = ["* * * * *"]

[vars]
PING_RADIUS_M = "100"    # widen to 300 if pings rarely match during the test
BOARD_RADIUS_M = "1000"
GOOGLE_CLIENT_ID = "REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID"
VAPID_PUBLIC_KEY = "BEGHio6UR2wIKavf4h2ExhpjLc6FCX9SQLv0cmKEvevCXc5g-C2JceSOCbXaThQgWUdmihJfBo3hbcZuDqSSsR0"
VAPID_PRIVATE_KEY = "V4yrYGC38d31DeWmPbHg7QcvaQQBqbfv3lBu9ifYETs"
